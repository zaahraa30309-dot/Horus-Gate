<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graduation Group – Horus Gate</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0906;--c:#17120b;--c2:#211a0f;--g:#d4a64a;--g2:#8a6a25;--t:#f1e6cf;--m:#a99a7c;--bl:#1c2a52;--r:#e0644f;--ok:#6fbf73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g2);background:var(--c)}
header img{width:52px;height:52px;border-radius:10px}header h1{font-size:17px;margin:0;color:var(--g)}header small{color:var(--m)}
.me{margin-inline-start:auto;text-align:left;font-size:12px;color:var(--m)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--c2);position:sticky;top:0;z-index:5}
nav a{white-space:nowrap;padding:6px 12px;border-radius:20px;color:var(--t);text-decoration:none;font-size:14px;border:1px solid transparent}
nav a.on{background:var(--g);color:#1a1205;font-weight:700}
main{max-width:980px;margin:auto;padding:14px}
.card{background:var(--c);border:1px solid #3a2e17;border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.st{text-align:center}.st b{display:block;font-size:26px;color:var(--g)}.st span{font-size:13px;color:var(--m)}
h2,h3{color:var(--g);margin:6px 0}
button,.b{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 14px;background:var(--g);color:#1a1205;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.b2{background:transparent;color:var(--g);border:1px solid var(--g2)}.bd{background:transparent;color:var(--r);border:1px solid var(--r)}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;background:#0f0b06;color:var(--t);border:1px solid var(--g2);border-radius:8px;padding:8px;margin:3px 0 8px}
label{display:block;font-size:13px;color:var(--m)}
.bar{height:12px;background:#2a2112;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .f{flex:1 1 140px}
.tag{font-size:12px;padding:1px 9px;border-radius:12px;background:var(--bl);color:#cdd8ff}.late{color:var(--r)}.ok{color:var(--ok)}
.muted{color:var(--m);font-size:13px}
#m{position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:14px}#m[hidden]{display:none}
.bx{max-width:640px;margin:auto;background:var(--c);border:1px solid var(--g);border-radius:12px;padding:14px}
.doc{background:#fbf6ea;color:#241c0e;border-radius:12px;padding:18px 20px;font-size:17px}.doc h2,.doc h3,.doc h4{color:#6b4a0c}.doc img{max-width:100%;border-radius:8px}
.doc table{border-collapse:collapse;width:100%}.doc td,.doc th{border:1px solid #c9b88f;padding:5px 8px}.doc th{background:#eadfc3}
.sc{overflow-x:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols>div{background:#0f0b06;border-radius:8px;padding:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.add{background:#1f3a1f}.del{background:#4a1f1a;text-decoration:line-through}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal img{width:100%;height:130px;object-fit:cover;border-radius:8px;cursor:pointer}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
@media print{header,nav,.np{display:none!important}body{background:#fff}.doc{padding:0}}

function render(){if(!db)return;const pend=G('proposals').filter(p=>p.status=='pending').length;$('#nav').innerHTML=NAV.concat(ADM?[['requests','الطلبات']]:[]).map(n=>`<a href="#${n[0]}" class="${V==n[0]||(V=='ch'&&n[0]=='chapters')?'on':''}">${n[1]}${n[0]=='review'&&pend?' ('+pend+')':''}${n[0]=='requests'&&(S.profiles||[]).filter(p=>!p.approved).length?' (جديد)':''}</a>`).join('');
$('#me').innerHTML=e(ME.name)+'<br>'+(ADM?'الأدمن':'عضوة')+' · <a href=# data-a=out style="color:var(--g)">خروج</a>';$('#app').innerHTML=VIEWS[V]();fill()}
function route(){const h=location.hash.slice(1).split('/');V=VIEWS[h[0]]?h[0]:'home';ARG=h[1]||'';F={q:'',st:'',mem:'',cat:'',ch:''};render();scrollTo(0,0)}
A.back=()=>{location.hash='chapters'};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;if(el.tagName=='A'&&el.href&&el.classList.contains('b'))return;const f=A[el.dataset.a];if(f){ev.preventDefault();f(el.dataset.k?el.dataset.i:el.dataset.i||el,el.dataset.k||undefined);}});
document.addEventListener('input',ev=>{const k=ev.target.dataset.f;if(k){F[k]=ev.target.value;fill()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.f){F[t.dataset.f]=t.value;fill()}if(t.dataset.chg){const x=G('tasks').find(y=>y.id==t.dataset.i);put('tasks',x.id,{...x,status:t.value});logA('غيّرت حالة «'+x.title+'» إلى '+ST[t.value])}});
addEventListener('hashchange',route);
let SB,last='',poll,ht,running=0;const SU={};
const gate=x=>{$('#app').innerHTML=x;$('#nav').innerHTML='';$('#me').innerHTML=''},say=t=>{const m=$('#msg');if(m)m.textContent=t};
function loginV(){gate(`<div class=card style="max-width:420px;margin:auto"><h2>تسجيل الدخول</h2><label>الاسم (عند طلب الانضمام فقط)<input id=n></label><label>البريد الإلكتروني<input id=em type=email></label><label>كلمة المرور (٨ أحرف على الأقل)<input id=pw type=password></label><div class=row><button data-a=login>دخول</button><button class=b2 data-a=signup>طلب انضمام</button><button class=b2 data-a=forgot>نسيت كلمة المرور</button></div><p id=msg class=muted></p></div>`)}
A.login=async()=>{const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)say('تعذّر الدخول: البريد أو كلمة المرور غير صحيحة.')};
A.signup=async()=>{const n=$('#n').value.trim();if(!n)return say('اكتبي اسمك أولاً');const{error}=await SB.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{name:n}}});say(error?'تعذّر إنشاء الحساب: '+error.message:'تم إرسال طلب الانضمام. انتظري موافقة الأدمن (وأكّدي بريدك إن وصلتك رسالة تأكيد).')};
A.forgot=async()=>{const m=$('#em').value.trim();if(!m)return say('اكتبي بريدك أولاً');const{error}=await SB.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});say(error?error.message:'تم إرسال رابط استعادة كلمة المرور إلى بريدك.')};
A.out=async()=>{await SB.auth.signOut();location.hash='';location.reload()};
A.newpw=async()=>{const{error}=await SB.auth.updateUser({password:$('#pw').value});if(error)return say(error.message);location.hash='';location.reload()};
A.apr=async i=>{const{error}=await SB.from('profiles').update({approved:true}).eq('id',i);if(error)return err(error);logA('وافقت على انضمام عضوة');last='';pull()};
A.susp=async i=>{if(confirm('إيقاف هذا الحساب؟')){const{error}=await SB.from('profiles').update({approved:false}).eq('id',i);if(error)return err(error);last='';pull()}};
function reqV(){const l=S.profiles||[],row=p=>`<div class=card><div class=row><b class=f>${e(p.name)}</b><span class=muted>${e(p.email)}</span>${p.approved?(p.id!=ME.id?`<button class=bd data-a=susp data-i=${p.id}>إيقاف</button>`:'<span class=tag>أنتِ</span>'):`<button data-a=apr data-i=${p.id}>قبول</button>`}</div></div>`;return'<h2>طلبات الانضمام</h2>'+(l.filter(p=>!p.approved).map(row).join('')||'<p class=muted>لا توجد طلبات جديدة.</p>')+`<h3>الحسابات المقبولة (${l.filter(p=>p.approved).length})</h3>`+l.filter(p=>p.approved).map(row).join('')}
async function pull(){const{data,error}=await SB.from('docs').select('col,id,data');if(error)return;const n={};COLS.forEach(c=>n[c]=[]);data.forEach(d=>n[d.col]&&n[d.col].push({id:d.id,...d.data}));
if(ADM){const r=await SB.from('profiles').select('id,name,email,role,approved');n.profiles=r.data||[]}
const j=JSON.stringify(n);if(j===last)return;last=j;S=n;
if(!seeded&&!S.members.find(m=>m.id==ME.id)){seeded=1;put('members',ME.id,{name:ME.name,role:ADM?'الأدمن':'عضوة',uid:ME.id})}
if($('#m').hidden)render()}
async function hydrate(){const els=[...document.querySelectorAll('[src^="/_blob/"],[href^="/_blob/"]')],at=x=>x.hasAttribute('src')?'src':'href',ps=[...new Set(els.map(x=>x.getAttribute(at(x)).slice(7)))].filter(p=>!(SU[p]&&SU[p].t>Date.now()));
if(ps.length){const{data}=await SB.storage.from('files').createSignedUrls(ps,3600);(data||[]).forEach(x=>{if(x.signedUrl)SU[x.path]={u:x.signedUrl,t:Date.now()+3.3e6}})}
els.forEach(x=>{const p=x.getAttribute(at(x)).slice(7);if(SU[p])x.setAttribute(at(x),SU[p].u)})}
new MutationObserver(()=>{clearTimeout(ht);ht=setTimeout(hydrate,60)}).observe(document.body,{childList:true,subtree:true});
async function start(s){const{data:p}=await SB.from('profiles').select('*').eq('id',s.user.id).single();if(!p)return gate('<div class=card>تعذّر تحميل الحساب.</div>');
ME={id:s.user.id,name:p.name||'عضوة',email:p.email};ADM=p.role=='admin'&&p.approved;
if(!p.approved){gate(`<div class=card><h3>طلبك قيد المراجعة ⏳</h3><p>حسابك (${e(p.email)}) بانتظار موافقة الأدمن. سيفتح المشروع تلقائياً بعد القبول.</p><button class=b2 data-a=out>تسجيل الخروج</button></div>`);clearInterval(poll);poll=setInterval(()=>start(s),8000);return}
clearInterval(poll);if(running)return;running=1;
db={collection:c=>({doc:id=>({async set(d){const{error}=await SB.from('docs').upsert({col:c,id,data:d});if(error)throw error;last='';await pull()},async delete(){const{error}=await SB.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;last='';await pull()}})})};
assets={async upload(f){const k=uid()+(f.name.match(/\.\w+$/)||[''])[0].toLowerCase(),{error}=await SB.storage.from('files').upload(k,f,{contentType:f.type||undefined});if(error)throw error;return{id:k,sizeBytes:f.size}},async delete(k){await SB.storage.from('files').remove([k])}};
dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;a.click()}};
await pull();route();setInterval(()=>{if(!document.hidden&&$('#m').hidden)pull()},6000)}
(async()=>{if(!window.supabase||SUPABASE_URL.startsWith('PASTE'))return gate('<div class=card><h3>التطبيق غير مضبوط بعد</h3><p>ضعي رابط ومفتاح Supabase في أول الملف (راجعي ملف الخطوات).</p></div>');
SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
SB.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY'){running=1;gate('<div class=card style="max-width:420px;margin:auto"><h3>كلمة مرور جديدة</h3><input id=pw type=password placeholder="كلمة المرور الجديدة"><button data-a=newpw>حفظ</button><p id=msg class=muted></p></div>');return}
if(ev=='SIGNED_OUT'){if(!running)loginV();return}if(s&&(ev=='INITIAL_SESSION'||ev=='SIGNED_IN'))setTimeout(()=>start(s),0);else if(!s&&ev=='INITIAL_SESSION')loginV()})})();
</script></body></html>
